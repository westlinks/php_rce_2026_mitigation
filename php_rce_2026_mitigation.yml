---
# =============================================================================
# PLAY 1: GLOBAL PHP MITIGATION & FPM POOL ALIGNMENT (ALL HOSTS)
# =============================================================================
- name: Universal PHP Mitigation and FPM Configuration
  hosts: all
  become: true
  vars:
    fpm_user: jenkins
    fpm_group: www-data

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    # --- FPM POOL CONFIGURATION ---

    - name: Find all PHP-FPM www.conf pool files
      ansible.builtin.find:
        paths: /etc/php
        patterns: "www.conf"
        recurse: true
      register: fpm_pool_matches

    - name: Align PHP-FPM pool user to jenkins
      community.general.ini_file:
        path: "{{ item.path }}"
        section: www
        option: user
        value: "{{ fpm_user }}"
        no_extra_spaces: true
        mode: "0644"
      loop: "{{ fpm_pool_matches.files }}"
      when: fpm_pool_matches.matched > 0

    - name: Ensure PHP-FPM pool group is www-data
      community.general.ini_file:
        path: "{{ item.path }}"
        section: www
        option: group
        value: "{{ fpm_group }}"
        no_extra_spaces: true
        mode: "0644"
      loop: "{{ fpm_pool_matches.files }}"
      when: fpm_pool_matches.matched > 0

    - name: Ensure PHP-FPM listen socket owner is jenkins
      community.general.ini_file:
        path: "{{ item.path }}"
        section: www
        option: listen.owner
        value: "{{ fpm_user }}"
        no_extra_spaces: true
        mode: "0644"
      loop: "{{ fpm_pool_matches.files }}"
      when: fpm_pool_matches.matched > 0

    - name: Ensure PHP-FPM listen socket group is www-data
      community.general.ini_file:
        path: "{{ item.path }}"
        section: www
        option: listen.group
        value: "{{ fpm_group }}"
        no_extra_spaces: true
        mode: "0644"
      loop: "{{ fpm_pool_matches.files }}"
      when: fpm_pool_matches.matched > 0

    - name: Ensure PHP-FPM listen socket mode is 0660
      community.general.ini_file:
        path: "{{ item.path }}"
        section: www
        option: listen.mode
        value: "0660"
        no_extra_spaces: true
        mode: "0644"
      loop: "{{ fpm_pool_matches.files }}"
      when: fpm_pool_matches.matched > 0

    # --- PHP INI MITIGATIONS ---

    - name: Find all php.ini files dynamically
      ansible.builtin.find:
        paths: /etc/php
        patterns: "php.ini"
        recurse: true
      register: php_ini_matches

    - name: Backup php.ini files before making changes
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ item.path }}.bak_{{ ansible_date_time.date }}"
        remote_src: true
        force: false
        mode: preserve
      loop: "{{ php_ini_matches.files }}"
      when: php_ini_matches.matched > 0

    - name: Disable session.upload_progress.enabled
      community.general.ini_file:
        path: "{{ item.path }}"
        section: PHP
        option: session.upload_progress.enabled
        value: "0"
        no_extra_spaces: true
        mode: "0644"
      loop: "{{ php_ini_matches.files }}"
      when: php_ini_matches.matched > 0

    - name: Set memory_limit = -1
      community.general.ini_file:
        path: "{{ item.path }}"
        section: PHP
        option: memory_limit
        value: "-1"
        no_extra_spaces: true
        mode: "0644"
      loop: "{{ php_ini_matches.files }}"
      when: php_ini_matches.matched > 0

    # --- RESTART SERVICES ---

    - name: Restart running PHP-FPM services
      ansible.builtin.service:
        name: "{{ item }}"
        state: restarted
      loop: >-
        {{
          ansible_facts.services.keys()
          | select('match', '^php.*-fpm(\\.service)?$')
          | map('regex_replace', '\\.service$', '')
          | unique
          | list
        }}
      when:
        - (item in ansible_facts.services and ansible_facts.services[item].state == 'running') or
          ((item ~ '.service') in ansible_facts.services and ansible_facts.services[item ~ '.service'].state == 'running')

    - name: Reload running web servers
      ansible.builtin.service:
        name: "{{ item }}"
        state: reloaded
      loop:
        - apache2
        - httpd
        - nginx
      when:
        - (item in ansible_facts.services and ansible_facts.services[item].state == 'running') or
          ((item ~ '.service') in ansible_facts.services and ansible_facts.services[item ~ '.service'].state == 'running')
      failed_when: false

# =============================================================================
# PLAY 2: WORDPRESS-SPECIFIC PERMISSIONS & FS_METHOD (TARGETED)
# =============================================================================
- name: WordPress Permissions and Filesystem Fixes
  hosts: wordpress
  become: true
  tasks:
    - name: Locate wp-config.php files
      ansible.builtin.find:
        paths:
          - /var/www
        patterns: "wp-config.php"
        recurse: true
        depth: 4
      register: wp_configs

    - name: Prevent FTP prompts by enforcing direct filesystem method
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        line: "define('FS_METHOD', 'direct');"
        insertafter: "^<\\?php"
        state: present
        mode: "0640"
      loop: "{{ wp_configs.files }}"
      when: wp_configs.matched > 0

    - name: Ensure wp-content and uploads directories are owned by jenkins:www-data
      ansible.builtin.file:
        path: "{{ item.path | dirname }}/wp-content"
        owner: jenkins
        group: www-data
        recurse: true
        state: directory
        mode: "u=rwX,g=rwX,o=rX"
      loop: "{{ wp_configs.files }}"
      when: wp_configs.matched > 0