---
- name: Category A Legacy PHP Emergency Mitigation
  hosts: category_a
  become: yes
  tasks:

    - name: Gather service facts
      service_facts:

    - name: Find all php.ini files dynamically
      find:
        paths:
          - /etc/php
          - /etc/php.ini
          - /etc/php.d
        patterns: "php.ini"
        recurse: yes
      register: php_ini_matches

    - name: Backup php.ini files before applying changes
      copy:
        src: "{{ item.path }}"
        dest: "{{ item.path }}.bak_{{ ansible_date_time.date }}"
        remote_src: yes
        force: no
      loop: "{{ php_ini_matches.files }}"
      when: php_ini_matches.matched > 0

    - name: Disable session.upload_progress.enabled (CVE-2026-109619)
      ini_file:
        path: "{{ item.path }}"
        section: PHP
        option: session.upload_progress.enabled
        value: "0"
        no_extra_spaces: yes
      loop: "{{ php_ini_matches.files }}"
      when: php_ini_matches.matched > 0

    - name: Set memory_limit = -1 (CVE-2026-109618)
      ini_file:
        path: "{{ item.path }}"
        section: PHP
        option: memory_limit
        value: "-1"
        no_extra_spaces: yes
      loop: "{{ php_ini_matches.files }}"
      when: php_ini_matches.matched > 0

    - name: Set post_max_size = 32M (Limit request body size)
      ini_file:
        path: "{{ item.path }}"
        section: PHP
        option: post_max_size
        value: "32M"
        no_extra_spaces: yes
      loop: "{{ php_ini_matches.files }}"
      when: php_ini_matches.matched > 0

    - name: Restart active PHP-FPM services
      service:
        name: "{{ item | regex_replace('\\.service$', '') }}"
        state: restarted
      loop: "{{ ansible_facts.services.keys() | select('match', '^(php.*-fpm|php-fpm)(\\..*)?$') | map('regex_replace', '\\.service$', '') | unique | list }}"
      when: item in ansible_facts.services or (item ~ '.service') in ansible_facts.services

    - name: Restart web server services (Apache / Httpd)
      service:
        name: "{{ item }}"
        state: restarted
      loop:
        - apache2
        - httpd
      when: item in ansible_facts.services or (item ~ '.service') in ansible_facts.services
      ignore_errors: yes

    # --- VERIFICATION TASKS ---

    - name: Verify PHP runtime INI settings
      command: >
        php -r 'echo "memory_limit: " . ini_get("memory_limit") . " | upload_progress: " . ini_get("session.upload_progress.enabled") . "\n";'
      register: php_ini_verify
      changed_when: false
      ignore_errors: yes

    - name: Display PHP INI verification results
      debug:
        msg: "{{ inventory_hostname }} -> {{ php_ini_verify.stdout | default('PHP CLI not present') }}"

    - name: Verify HTTP health via curl
      delegate_to: localhost
      become: no
      command: >
        curl -sLk -o /dev/null -w "%{http_code}" --connect-timeout 5 "http://{{ ansible_host }}"
      register: http_check
      changed_when: false
      ignore_errors: yes

    - name: Display HTTP verification results
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) -> HTTP Status: {{ http_check.stdout | default('Connection failed') }}"
